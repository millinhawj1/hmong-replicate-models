name: Push Models to Replicate

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Models to push (space-separated, or "all")'
        required: false
        default: 'all'

jobs:
  push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model:
          - hmong-tts
          - talking-photo
          - singing-photo
          - hmong-talking-avatar
          - hmong-singing-avatar
          - hmong-voice-clone
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cog
        run: |
          curl -o /usr/local/bin/cog -L \
            https://github.com/replicate/cog/releases/latest/download/cog_Linux_x86_64
          chmod +x /usr/local/bin/cog
          cog --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Push ${{ matrix.model }} to Replicate
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          cd ${{ matrix.model }}
          cog push r8.im/millinhawj1/${{ matrix.model }}
